<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NGY Reading Room — cross-platform ebook library (PDF + EPUB, Myanmar + English, Google Drive sync)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NGY Reading Room">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In client ID for the web version (OAuth client
       "NGY Reading Room Web" in GCP project ngy-reading-room). This is a
       public identifier, not a secret. -->
  <meta name="google-signin-client_id" content="558731995956-62vmu51o4gk5stjfp063506v4nlcbasp.apps.googleusercontent.com">

  <!-- PDF.js (Mozilla, Apache 2.0) — REQUIRED by syncfusion_flutter_pdfviewer
       on the web: the viewer renders PDF pages through the global pdfjsLib
       (see the package README: "the script file must be referred to in
       your web/index.html file"). Without it every PDF opens blank with
       "Page 1 of 0" and no error (verified 2026-11-11). Bundled locally
       (pdf.min.js + pdf.worker.min.js, v2.11.338) instead of a CDN so the
       app does not depend on extra network access. -->
  <script src="pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  </script>

  <title>NGY Reading Room</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
